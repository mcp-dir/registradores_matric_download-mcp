# Smithery configuration for Registradores (ARISP) Matrícula: Download de Matrícula
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_registradores_matric_download

name: registradores_matric_download-mcp
displayName: "Registradores (ARISP) Matrícula: Download de Matrícula"
description: >
  Registradores (ARISP) Matrícula: Download de Matrícula, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/registradores_matric_download-mcp
repository: https://github.com/mcp-dir/registradores_matric_download-mcp

tags:
  - registradores_matric_download
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_registradores_matric_download

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_registradores_matric_download/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
